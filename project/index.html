        <details><summary>PowerGym</summary><p>A centralized gym management platform for members, subscriptions, payments, coaches, operations, and business analytics.</p><p>PowerGym is a complete gym management platform designed to help fitness businesses organize and manage their daily operations through a centralized digital system.</p><p>The platform replaces manual processes with tools for managing members, subscriptions, payments, coaches, schedules, expenses, and business analytics. Dashboards, structured data management, financial tracking, and automated workflows help gym owners run operations more efficiently.</p><p>Through PowerGym, I explored building a real-world SaaS-style application, focusing on scalability, clean architecture, and creating a product that solves practical business challenges.</p><a href="https://tkatek.github.io/gym-manager/" rel="noopener noreferrer" target="_blank">Open live project ↗</a></details>
